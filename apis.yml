name: OpenLoop Health
description: >-
  OpenLoop Health is a Des Moines, Iowa-based white-label telehealth
  infrastructure company that powers virtual care for digital health companies,
  health plans, diagnostic labs, retailers and pharmacies, and hospitals and
  health systems. Its platform bundles a nationwide clinician network (covering
  all 50 states and more than 500,000 patient visits per month), provider
  staffing, licensing and credentialing, payer coverage and revenue cycle
  management, diagnostic imaging, regulatory and legal support, and practice
  management, with AI-powered clinical operations across synchronous and
  asynchronous care. OpenLoop delivers its capabilities through EHR integrations
  and protocol-specific API integrations offered to partners via sales; as of
  this profile there is no publicly published API specification, SDK, developer
  portal, or developer documentation.
